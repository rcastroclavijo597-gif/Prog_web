    <link rel="stylesheet" href="../css/base/variables.css">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/subnav.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/modules/dashboard.css">
    <link rel="stylesheet" href="../css/modules/calendario.css">

<body>
    <nav class="navbar">
        <div class="nav-izq">
            <div class="logo"><span class="icono-logo">*</span> vibra</div>
            <span class="badge-admin">Administración</span>
        </div>
        <div class="nav-der">
            <a href="perfil.html" style="color: #AAA; text-decoration: none;">Mi perfil</a>

        </div>
    </nav>
    <div class="sub-nav">

    <main class="contenedor-dashboard">

            </div>

        <div class="calendario-contenedor">

                <div class="mes-selector">
                    <button class="btn-mes" onclick="cambiarMes(-1)">&larr;</button>
                    <span id="mes-anio-texto">Mayo 2026</span>
                    <button class="btn-mes" onclick="cambiarMes(1)">&rarr;</button>
                </div>

        </div>
