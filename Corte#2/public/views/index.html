<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibra - Acceso al Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/base/variables.css">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/modules/auth.css">
</head>
<body>
    <div class="seccion-izq">
        <a href="#" class="logo-container"><span>*</span> vibra</a>
        <div class="formulario-wrapper">
            <div id="error-alerta" class="error-msg"></div>

            <div id="wrapper-login">
                <div class="etiqueta-pequena">QUÉ BUENO VERTE</div>
                <h1 class="titulo-auth">Vuelve a crear momentos.</h1>
                <p class="subtitulo-auth">Accede a tus eventos, presupuestos y servicios contratados.</p>
                <form onsubmit="manejarLogin(event)">
                    <div class="form-group">
                        <label>Correo electrónico</label>
                        <input type="email" id="login-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="login-password" placeholder="Tu contraseña" required>
                    </div>
                    <button type="submit" class="btn-crear-evento" style="width: 100%;">Iniciar sesión &rarr;</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
