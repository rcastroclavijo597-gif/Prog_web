<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibra - Crear Cuenta</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="contenedor-principal">
        
        <!-- MITAD IZQUIERDA: Formulario de Registro -->
        <section class="seccion-formulario">
            
            <div class="contenido-izquierdo">
                
                <!-- Encabezado con Logo y Botón de Iniciar Sesión -->
                <header class="encabezado-superior">
                    <div class="logo">
                        <span class="icono-logo">*</span> vibra
                    </div>
                    <a href="index.html" class="btn-pill">Iniciar sesión</a>
                </header>

                <!-- Botón volver -->
                <a href="#" class="enlace-volver">
                    &larr; Volver al inicio
                </a>

                <!-- Textos principales -->
                <p class="etiqueta-morada">ÚNETE A VIBRA</p>
                <h1 class="titulo-principal">Empecemos a crear<br>algo grande.</h1>
                <p class="subtitulo">Cuéntanos un poco sobre ti. Solo te llevará un minuto.</p>

                <!-- Formulario -->
                <form id="formRegistro" class="formulario">
                    
                    <!-- Fila para Nombre y Apellidos -->
                    <div class="fila-inputs">
                        <div class="grupo-input">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" placeholder="Tu nombre">
                        </div>
                        <div class="grupo-input">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" placeholder="Tus apellidos">
                        </div>
                    </div>

                    <!-- Correo electrónico -->
                    <div class="grupo-input">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" placeholder="tu@email.com">
                    </div>

                    <!-- Teléfono -->
                    <div class="grupo-input">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="+34 600 000 000">
                    </div>

                    <!-- Contraseña -->
                    <div class="grupo-input">
                        <label for="password">Contraseña</label>
                        <div class="input-con-icono">
                            <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                            <button type="button" class="btn-icono">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Términos y Privacidad -->
                    <div class="opciones-extra" style="margin-top: 5px;">
                        <label class="checkbox-container">
                            <input type="checkbox" id="terminos">
                            <span class="checkmark"></span>
                            <span class="texto-checkbox">Acepto los <a href="#" class="enlace-subrayado">términos de uso</a> y la política de privacidad.</span>
                        </label>
                    </div>

                    <!-- Botón de envío -->
                    <button type="submit" class="btn-primario">
                        Crear mi cuenta &rarr;
                    </button>

                    <!-- Pie del formulario -->
                    <p class="texto-pie">
                        ¿Ya tienes una cuenta? <a href="index.html" class="enlace-subrayado">Iniciar sesión</a>
                    </p>
                </form>
            </div>
            
        </section>

        <!-- MITAD DERECHA: Imagen y Testimonio -->
        <section class="seccion-imagen">
            <div class="contenido-imagen">
                <div class="estrellas">★★★★★</div>
                <blockquote class="testimonio">
                    "Con Vibra, nuestra boda no fue una fiesta. Fue el evento del año."
                </blockquote>
                <p class="autor-testimonio"><strong>Laura & Dani</strong> <span class="ubicacion">Madrid · 2024</span></p>
            </div>
        </section>

    </main>
    <script>
    document.getElementById('formRegistro').addEventListener('submit', function(event) {
        event.preventDefault(); // Evitamos que la página cambie de golpe
        
        // Buscamos las cajas de texto de tu registro (Asegúrate de que tu caja de correo tenga id="correo")
        const correoInput = document.getElementById('correo');
        const passwordInput = document.getElementById('password');
        
        if (correoInput && passwordInput) {
            // Empaquetamos los datos del nuevo usuario
            const nuevoUsuario = {
                correo: correoInput.value,
                password: passwordInput.value
            };
            
            // Los guardamos en la memoria del navegador
            localStorage.setItem('usuario_vibra', JSON.stringify(nuevoUsuario));
            
            alert('¡Cuenta creada con éxito! Ahora inicia sesión.');
            
            // Ahora sí, lo enviamos al Iniciar Sesión
            window.location.href = 'index.html';
        } else {
            alert('Asegúrate de que tu input de correo tenga el id="correo"');
        }
    });
</script>
</body>
</html>
