<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibra - Mi Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F7F5F0;
            --text-color: #1A1A1A;
            --card-bg: #FFFFFF;
            --borde-card: #E5E2D9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar-cliente {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        .logo-cliente {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo-cliente span {
            background: #111;
            color: #5EEAD4;
            width: 28px;
            height: 28px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 1rem;
        }

        .perfil-container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--borde-card);
        }

        .perfil-header {
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: 1px solid var(--borde-card);
            padding-bottom: 30px;
            margin-bottom: 30px;
        }

        .avatar-grande {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 700;
        }

        .perfil-info h2 { font-size: 1.5rem; margin-bottom: 5px; }
        .perfil-info p { color: #666; font-size: 0.9rem; }

        .seccion-datos { margin-bottom: 30px; }
        .seccion-datos h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid var(--borde-card); padding-bottom: 10px; }
        
        .grid-datos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .campo-dato label { display: block; font-size: 0.75rem; text-transform: uppercase; color: #888; font-weight: 700; margin-bottom: 5px; }
        .campo-dato span { font-size: 1rem; font-weight: 500; color: #111; }

        .zona-peligro-perfil {
            background: #FFF5F5;
            border: 1px solid #FFE0E0;
            border-radius: 15px;
            padding: 25px;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .zona-peligro-perfil div h4 { color: #E53E3E; font-size: 1rem; margin-bottom: 5px; }
        .zona-peligro-perfil div p { color: #7A7A7A; font-size: 0.85rem; margin: 0; }
        
        .btn-cerrar-sesion-rojo {
            background: #E53E3E;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-cerrar-sesion-rojo:hover { background: #C53030; }
    </style>
</head>
<body>

    <header class="navbar-cliente">
        <a href="clientes_portal.html" class="logo-cliente"><span>*</span> vibra</a>
        <a href="clientes_portal.html" style="text-decoration: none; color: #666; font-size: 0.9rem; font-weight: 500;">&larr; Volver al evento</a>
    </header>

    <main class="perfil-container">
        <div class="perfil-header">
            <div class="avatar-grande" id="avatar-letra">C</div>
            <div class="perfil-info">
                <h2 id="nombre-perfil">Cliente Vibra</h2>
                <p id="correo-perfil">correo@email.com &middot; Rol: Cliente</p>
            </div>
        </div>

        <div class="seccion-datos">
            <h3>Información de tu cuenta</h3>
            <div class="grid-datos">
                <div class="campo-dato">
                    <label>Nombre o Empresa</label>
                    <span id="span-nombre">Cliente</span>
                </div>
                <div class="campo-dato">
                    <label>Correo electrónico</label>
                    <span id="span-correo">correo@email.com</span>
                </div>
                <div class="campo-dato">
                    <label>Tipo de cuenta</label>
                    <span>Cliente Registrado</span>
                </div>
                <div class="campo-dato">
                    <label>Estado de sesión</label>
                    <span style="color: #0D9488;">Activa</span>
                </div>
            </div>
        </div>

        <div class="zona-peligro-perfil">
            <div>
                <h4>Sesión activa</h4>
                <p>Cierra sesión de forma segura para finalizar tu actividad actual.</p>
            </div>
            <a href="index.html" class="btn-cerrar-sesion-rojo" onclick="localStorage.removeItem('vibra_rol'); return confirm('¿Estás seguro de que deseas cerrar sesión?');">Cerrar sesión</a>
        </div>
    </main>

    <script>
        window.onload = function() {
            const nombre = localStorage.getItem('vibra_usuario') || 'Cliente';
            const email = localStorage.getItem('vibra_email') || 'cliente@email.com';
            
            document.getElementById('nombre-perfil').innerText = nombre;
            document.getElementById('correo-perfil').innerText = `${email} · Rol: Cliente`;
            document.getElementById('span-nombre').innerText = nombre;
            document.getElementById('span-correo').innerText = email;
            document.getElementById('avatar-letra').innerText = nombre.charAt(0).toUpperCase();
        }
    </script>
</body>
</html>
