<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibra - Panel de Control</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-crema: #F7F5F0;
            --texto-principal: #1A1A1A;
            --cyan-vibra: #5EEAD4;
            --borde-input: #E5E2D9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-crema);
            color: var(--texto-principal);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: white;
            border-bottom: 1px solid var(--borde-input);
        }

        .logo-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            color: var(--texto-principal);
        }

        .logo-nav span {
            background: #111;
            color: var(--cyan-vibra);
            width: 26px;
            height: 26px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 0.9rem;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-accion-top {
            background: #111;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-accion-top:hover {
            background: #333;
        }

        .main-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .bienvenida-admin {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .sub-bienvenida {
            color: #666;
            margin-bottom: 30px;
        }

        /* Secciones del Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card-dash {
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--borde-input);
        }

        .card-dash h3 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .lista-eventos {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lista-eventos li {
            padding: 12px 0;
            border-bottom: 1px solid #F3F4F6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .lista-eventos li:last-child {
            border-bottom: none;
        }

        /* Modal para Crear Evento */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--borde-input);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            background: white;
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .btn-submit-modal {
            width: 100%;
            background: var(--cyan-vibra);
            color: #111;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-cerrar-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            font-size: 1.2rem; cursor: pointer;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-nav"><span>*</span> vibra</a>
        <div class="user-nav">
            <button class="btn-accion-top" onclick="abrirModalEvento()">+ Crear Nuevo Evento</button>
            <div style="font-weight: 700; font-size: 0.9rem;" id="admin-nombre">Admin</div>
            <button onclick="cerrarSesion()" style="background:none; border:none; color:#E53E3E; font-size:0.85rem; cursor:pointer; font-weight:700;">Salir</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="bienvenida-admin">Panel de Administración</h1>
        <p class="sub-bienvenida">Gestiona todos los eventos, presupuestos y accesos del sistema.</p>

        <div class="dashboard-grid">
            <div class="card-dash">
                <h3>Eventos Activos en el Sistema</h3>
                <ul class="lista-eventos" id="contenedor-eventos-admin">
                    <li><span>Boda Laura & Dani (Madrid)</span> <strong>Activo</strong></li>
                    <li><span>Cumpleaños Carlos M.</span> <strong>Pendiente</strong></li>
                </ul>
            </div>
            <div class="card-dash">
                <h3>Resumen Rápido</h3>
                <p><strong>Usuarios Clientes Registrados:</strong> <span id="total-clientes">0</span></p>
                <p><strong>Eventos Totales:</strong> <span id="total-eventos">2</span></p>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR EVENTO ADMINISTRADOR -->
    <div class="modal-overlay" id="modal-evento">
        <div class="modal-content">
            <button class="btn-cerrar-modal" onclick="cerrarModalEvento()">&times;</button>
            <h2>Crear Nuevo Evento</h2>
            <form onsubmit="guardarNuevoEventoAdmin(event)">
                <div class="form-group">
                    <label>Nombre del Evento / Cliente</label>
                    <input type="text" id="admin-ev-nombre" placeholder="Ej. Concierto Rock - Empresa X" required>
                </div>
                <div class="form-group">
                    <label>Tipo de Evento</label>
                    <select id="admin-ev-tipo" required>
                        <option value="Boda">Boda</option>
                        <option value="Cumpleaños">Cumpleaños</option>
                        <option value="Concierto">Concierto</option>
                        <option value="Evento Corporativo">Evento Corporativo</option>
                        <option value="Fiesta Privada">Fiesta Privada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="admin-ev-fecha" required>
                </div>
                <div class="form-group">
                    <label>Ciudad / Localidad</label>
                    <input type="text" id="admin-ev-ciudad" placeholder="Ej. Madrid" required>
                </div>
                <button type="submit" class="btn-submit-modal">Guardar y Publicar Evento</button>
            </form>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Verificar rol de admin
            const rol = localStorage.getItem('vibra_rol');
            if(rol !== 'admin') {
                window.location.href = 'index.html';
                return;
            }
            
            // Cargar conteo de clientes
            let clientes = JSON.parse(localStorage.getItem('vibra_clientes') || '[]');
            document.getElementById('total-clientes').innerText = clientes.length;
            
            // Cargar eventos guardados
            cargarEventosAdmin();
        };

        function abrirModalEvento() {
            document.getElementById('modal-evento').style.display = 'flex';
        }

        function cerrarModalEvento() {
            document.getElementById('modal-evento').style.display = 'none';
        }

        function guardarNuevoEventoAdmin(e) {
            e.preventDefault();
            const nombre = document.getElementById('admin-ev-nombre').value.trim();
            const tipo = document.getElementById('admin-ev-tipo').value;
            const fecha = document.getElementById('admin-ev-fecha').value;
            const ciudad = document.getElementById('admin-ev-ciudad').value.trim();

            let eventos = JSON.parse(localStorage.getItem('vibra_eventos_admin') || '[]');
            eventos.push({ nombre: `${nombre} (${tipo})`, fecha, ciudad });
            localStorage.setItem('vibra_eventos_admin', JSON.stringify(eventos));

            cerrarModalEvento();
            cargarEventosAdmin();
            alert('¡Evento creado exitosamente por el administrador!');
        }

        function cargarEventosAdmin() {
            let eventos = JSON.parse(localStorage.getItem('vibra_eventos_admin') || '[]');
            let contenedor = document.getElementById('contenedor-eventos-admin');
            
            let htmlInicial = `
                <li><span>Boda Laura & Dani (Madrid)</span> <strong>Activo</strong></li>
                <li><span>Cumpleaños Carlos M.</span> <strong>Pendiente</strong></li>
            `;

            eventos.forEach(ev => {
                htmlInicial += `<li><span>${ev.nombre} - ${ev.ciudad} (${ev.fecha})</span> <strong style="color: #059669;">Nuevo</strong></li>`;
            });

            contenedor.innerHTML = htmlInicial;
            document.getElementById('total-eventos').innerText = 2 + eventos.length;
        }

        function cerrarSesion() {
            localStorage.removeItem('vibra_rol');
            localStorage.removeItem('vibra_usuario');
            localStorage.removeItem('vibra_email');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
